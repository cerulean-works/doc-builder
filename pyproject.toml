[project]
# The name below is what `is_doc_builder_repo` looks for to detect this repo, do not rename it.
name = "cerulean-doc-builder"
version = "0.1.0"
description = "Builds static documentation sites from Markdown docs and Python docstrings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "cerulean-works"},
    {name = "Hugging Face, Inc.", email = "docs@huggingface.co"},
]
keywords = ["doc", "documentation", "doc-builder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tqdm",
    "pyyaml",
    "watchdog>=6.0.0",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/cerulean-works/doc-builder"
Repository = "https://github.com/cerulean-works/doc-builder"

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-xdist",
    # only needed by tests/test_autodoc.py
    "torch",
    "transformers",
    "tokenizers",
    "timm",
]
quality = [
    "ruff>=0.1.0"
]
dev = [
    "cerulean-doc-builder[testing,quality]",
]
release = ["twine"]

[project.scripts]
doc-builder = "doc_builder.commands.doc_builder_cli:main"

[project.entry-points.pytest11]
doc-builder = "doc_builder.pytest_plugin"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is `cerulean-doc-builder`, but the package it installs is `doc_builder` (in src/).
module-name = "doc_builder"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end builds that need node, pnpm and the kit (run with `pytest -m e2e`)",
]
addopts = "-m 'not e2e'"
doctest_optionflags = "NUMBER NORMALIZE_WHITESPACE ELLIPSIS"

[tool.ruff]
line-length = 119
target-version = "py310"
extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["doc_builder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
