name: Docs

# Builds and publishes doc-builder's own documentation (docs/source) with the same
# reusable workflows every project uses, called locally so they run at this commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Run by hand on main, or on a tag to rebuild that version.
  workflow_dispatch:

permissions: {}

# One run per ref at a time, in push order, so an older build never publishes over a newer one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build_docs.yml
    permissions:
      contents: read
    with:
      project: doc-builder
      not_python_module: true

  publish:
    needs: build
    uses: ./.github/workflows/publish_docs.yml
    # GitHub checks these against the preview jobs of publish_docs.yml even when they are skipped.
    # The production upload itself runs with no permissions.
    permissions:
      actions: read
      pull-requests: write
    with:
      project: doc-builder
      environment: production
    secrets:
      r2_access_key_id: ${{ secrets.DOC_BUILDER_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.DOC_BUILDER_R2_SECRET_ACCESS_KEY }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
