name: Docs PR cleanup

# Removes a PR's docs preview when the PR closes. Never checks out code.

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete:
    uses: ./.github/workflows/delete_pr_docs.yml
    permissions:
      pull-requests: write
    with:
      project: doc-builder
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      r2_access_key_id: ${{ secrets.DOC_BUILDER_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.DOC_BUILDER_R2_SECRET_ACCESS_KEY }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
