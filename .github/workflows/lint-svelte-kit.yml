name: SvelteKit Lint
on:
  pull_request:
    paths:
      - "kit/**"
      - ".github/workflows/lint-svelte-kit.yml"
  push:
    branches:
      - main

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: kit/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: kit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: kit

      - name: Checking lint/format errors
        run: pnpm run lint
        working-directory: kit

      - name: Running eslint
        run: pnpm run --if-present eslint
        working-directory: kit

      - name: Checking type errors
        run: pnpm run check
        working-directory: kit