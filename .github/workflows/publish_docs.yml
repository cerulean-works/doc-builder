name: Publish docs

# Reusable: uploads a `docs-build` artifact (from build_docs.yml) to R2 through
# the S3 API. Never checks out or executes code from the artifact.
#
# - environment: production  -> bucket cerulean-docs. Call it in the same
#   workflow as the build, after it, on push to main or a tag.
# - environment: preview     -> bucket cerulean-docs-preview. Call it from a
#   `workflow_run` workflow triggered by the PR build; the artifact is treated
#   as untrusted and verified against the PR before anything is uploaded.
#
# Upload order (C2): assets, then HTML, then <p>/_project.json (production
# only), then the <p>/_versions/<v> marker, then a delete of stale keys
# limited to <p>/<v>/. The marker is what makes a version visible.

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      environment:
        required: true
        type: string
        description: "production | preview"
      version:
        type: string
        default: ""
        description: "Production only, if build_docs.yml was given an explicit version. Default: the tag on tag pushes, else main."
      site_url:
        type: string
        default: "https://docs.cerulean.works"
      preview_site_url:
        type: string
        default: "https://docs-preview.cerulean.works"
    secrets:
      r2_access_key_id:
        required: true
      r2_secret_access_key:
        required: true
      cloudflare_account_id:
        required: true

permissions: {}

env:
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  check-environment:
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT: ${{ inputs.project }}
        run: |
          [[ "$ENVIRONMENT" == production || "$ENVIRONMENT" == preview ]] || { echo "::error::environment must be production or preview"; exit 1; }
          [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] || { echo "::error::invalid project '$PROJECT'"; exit 1; }

  production:
    needs: check-environment
    if: inputs.environment == 'production'
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: docs-${{ inputs.project }}-${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || 'main' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      BUCKET: cerulean-docs
      PROJECT: ${{ inputs.project }}
      VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || 'main' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docs-build
          path: ${{ runner.temp }}/docs-build

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.r2_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.r2_secret_access_key }}
          ACCOUNT_ID: ${{ secrets.cloudflare_account_id }}
          SRC_ROOT: ${{ runner.temp }}/docs-build
          COMMIT: ${{ github.sha }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.+-]*$ && "$VERSION" != latest ]] || { echo "::error::invalid version '$VERSION'"; exit 1; }
          src="$SRC_ROOT/$PROJECT/$VERSION"
          test -d "$src" || { echo "::error::artifact has no $PROJECT/$VERSION/"; exit 1; }
          r2() { aws --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" --region auto "$@"; }
          dest="s3://$BUCKET/$PROJECT/$VERSION/"

          echo "::group::1. Assets (_app/, pagefind/, everything but HTML)"
          r2 s3 sync "$src/" "$dest" --no-progress --exclude "*.html"
          echo "::endgroup::"

          # `cp`, not `sync`: pages are always rewritten, even when a re-run of an
          # older build has older mtimes than what is already in the bucket.
          echo "::group::2. HTML"
          r2 s3 cp "$src/" "$dest" --recursive --no-progress --exclude "*" --include "*.html"
          echo "::endgroup::"

          # Project metadata comes from main, so republishing an old tag never brings back an old
          # title or description. A project's very first publish seeds it from whatever version it is.
          echo "::group::3. Project metadata"
          if [ ! -f "$src/_project.json" ]; then
            echo "::warning::build has no _project.json"
          elif [ "$VERSION" == main ] || ! r2 s3api head-object --bucket "$BUCKET" --key "$PROJECT/_project.json" > /dev/null 2>&1; then
            r2 s3 cp "$src/_project.json" "s3://$BUCKET/$PROJECT/_project.json" --no-progress
          else
            echo "Keeping the project metadata published from main."
          fi
          echo "::endgroup::"

          echo "::group::4. Version marker"
          : > "$RUNNER_TEMP/marker"
          r2 s3 cp "$RUNNER_TEMP/marker" "s3://$BUCKET/$PROJECT/_versions/$VERSION" --no-progress \
            --metadata "commit=$COMMIT,built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::endgroup::"

          # Old hashed chunks under _app/immutable/ are kept: readers who still have a page of the
          # previous build open load them on their next client-side navigation.
          echo "::group::5. Remove stale objects under $PROJECT/$VERSION/"
          r2 s3 sync "$src/" "$dest" --no-progress --size-only --delete --exclude "_app/immutable/*"
          echo "::endgroup::"

          echo "Published $SITE_URL/$PROJECT/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

  # Untrusted input: the artifact was built from PR code. This job only reads
  # two small files from it and checks them against the triggering run and the
  # PR before the upload job gets to see the PR number.
  preview-check:
    needs: check-environment
    if: >-
      inputs.environment == 'preview' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.verify.outputs.pr_number }}
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docs-build
          path: ${{ runner.temp }}/docs-build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify PR number and commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_ROOT: ${{ runner.temp }}/docs-build
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number=$(head -c 32 "$SRC_ROOT/pr_number" | tr -d '[:space:]')
          commit_sha=$(head -c 64 "$SRC_ROOT/commit_sha" | tr -d '[:space:]')
          [[ "$pr_number" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::invalid pr_number"; exit 1; }
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit_sha"; exit 1; }
          [ "$commit_sha" == "$RUN_HEAD_SHA" ] || { echo "::error::commit_sha does not match the triggering run"; exit 1; }

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")
          head_sha=$(jq -r .head.sha <<< "$pr")
          state=$(jq -r .state <<< "$pr")
          [ "$head_sha" == "$RUN_HEAD_SHA" ] || { echo "::error::PR #$pr_number head is $head_sha, not $RUN_HEAD_SHA"; exit 1; }
          [ "$state" == open ] || { echo "::error::PR #$pr_number is $state"; exit 1; }

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

  preview:
    needs: preview-check
    permissions:
      actions: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: docs-${{ inputs.project }}-pr_${{ needs.preview-check.outputs.pr_number }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      BUCKET: cerulean-docs-preview
      # The project always comes from the caller, never from the artifact.
      PROJECT: ${{ inputs.project }}
      PR_NUMBER: ${{ needs.preview-check.outputs.pr_number }}
      COMMIT: ${{ needs.preview-check.outputs.commit_sha }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: docs-build
          path: ${{ runner.temp }}/docs-build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.r2_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.r2_secret_access_key }}
          ACCOUNT_ID: ${{ secrets.cloudflare_account_id }}
          SRC_ROOT: ${{ runner.temp }}/docs-build
        run: |
          set -euo pipefail
          version="pr_$PR_NUMBER"
          src="$SRC_ROOT/$PROJECT/$version"
          test -d "$src" && ! test -L "$src" || { echo "::error::artifact has no $PROJECT/$version/"; exit 1; }
          if [ -n "$(find "$src" -type l -print -quit)" ]; then echo "::error::artifact contains symlinks"; exit 1; fi
          r2() { aws --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" --region auto "$@"; }
          dest="s3://$BUCKET/$PROJECT/$version/"

          # `cp` (not `sync`) rewrites every object, so each one's age restarts
          # for the bucket's 30-day lifecycle rule. _project.json is never
          # uploaded to preview.
          echo "::group::1. Assets"
          r2 s3 cp "$src/" "$dest" --recursive --no-progress --no-follow-symlinks \
            --exclude "*.html" --exclude "_project.json"
          echo "::endgroup::"

          echo "::group::2. HTML"
          r2 s3 cp "$src/" "$dest" --recursive --no-progress --no-follow-symlinks \
            --exclude "*" --include "*.html"
          echo "::endgroup::"

          echo "::group::3. Version marker"
          : > "$RUNNER_TEMP/marker"
          r2 s3 cp "$RUNNER_TEMP/marker" "s3://$BUCKET/$PROJECT/_versions/$version" --no-progress \
            --metadata "commit=$COMMIT,built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::endgroup::"

          echo "::group::4. Remove pages deleted since the previous push"
          r2 s3 sync "$src/" "$dest" --no-progress --no-follow-symlinks --size-only --delete \
            --exclude "_project.json" --exclude "_app/immutable/*"
          echo "::endgroup::"

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ inputs.preview_site_url }}/${{ inputs.project }}/pr_${{ needs.preview-check.outputs.pr_number }}/
        run: |
          set -euo pipefail
          marker="<!-- cerulean-docs-preview -->"
          body="$marker
          The docs for this PR are at **$URL** (built from ${COMMIT:0:7}).

          They update on every push, are removed when the PR closes, and expire 30 days after the last update."
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
